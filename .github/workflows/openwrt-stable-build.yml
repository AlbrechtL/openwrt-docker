name: OpenWrt stable build

on:
  push:
    branches:
      - master

jobs:
  build-test-publish:
    uses: ./.github/workflows/build-test-publish.yml
    with:
      openwrt_version: 25.12.6
      ci_tag: ci-openwrt-stable
      app_version_prefix: 25.12.6
      publish_tags: latest
      publish_versioned_tag: true
    secrets: inherit
