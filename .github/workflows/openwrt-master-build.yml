name: OpenWrt master build

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 20 * * *'

jobs:
  build-test-publish:
    uses: ./.github/workflows/build-test-publish.yml
    with:
      openwrt_version: master
      ci_tag: ci-openwrt-master-snapshot
      app_version_prefix: '0.0.0'
      publish_tags: openwrt-master-snapshot
    secrets: inherit
