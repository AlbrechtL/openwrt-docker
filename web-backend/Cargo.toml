[package]
name = "qemu-openwrt-web-backend"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt", "net", "process", "sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
